$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/joyhpc/DebugTool/schemas/asset_schema.yaml"
title: "DebugTool Asset"
type: object
additionalProperties: true
required:
  - asset_type
  - id
  - title
  - version
  - domain
  - applicability
  - use_when
  - do_not_use_when
  - confidence
  - safety_level
  - source
  - status
properties:
  asset_type:
    type: string
    enum:
      - link_model
      - signature
      - case_record
      - pattern_bundle
      - debug_principle
    x-id-prefix:
      link_model: "LM-"
      signature: "SIG-"
      case_record: "CASE-"
      pattern_bundle: "PBU-"
      debug_principle: "DP-"
  id:
    type: string
    minLength: 1
  title:
    type: string
    minLength: 1
  version:
    type: string
    minLength: 1
  domain:
    type: string
    enum:
      - power
      - embedded
      - high_speed
      - software
      - system
      - measurement
      - production
      - digital_interface
      - hardware
      - other
  applicability:
    type: string
    minLength: 1
  project_id:
    type: string
  use_when:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: true
      required:
        - condition
        - weight
      properties:
        condition:
          type: string
          minLength: 1
        weight:
          type: string
          enum:
            - high
            - medium
            - low
  do_not_use_when:
    type: array
  required_evidence:
    type: array
    items:
      type: object
      additionalProperties: true
      properties:
        kind:
          type: string
          minLength: 1
        must_be:
          type: string
          enum:
            - present
            - absent
            - matches_pattern
            - preferred
  references:
    type: array
    items:
      type: object
      additionalProperties: true
      required:
        - id
        - relation
      properties:
        id:
          type: string
          minLength: 1
        relation:
          type: string
          enum:
            - derived_from
            - refines
            - counterexample_of
            - parent_of
            - supports
            - depends_on
  safety_level:
    type: string
    enum:
      - S0
      - S1
      - S2
      - S3
  destructive:
    type: boolean
  source:
    type: object
    additionalProperties: true
    required:
      - type
      - citation
    properties:
      type:
        type: string
        enum:
          - seed
          - real_case
          - authoritative_doc
          - project_doc
          - hypothesis
          - public_article
          - public_forum
          - vendor_app_note
          - user_provided_article
      citation:
        type: string
  confidence:
    type: string
    enum:
      - low
      - medium
      - high
  counterexamples:
    type: array
  status:
    type: string
    enum:
      - draft
      - candidate
      - validated_seed
      - validated_real_case
      - generalized
      - deprecated
  last_validated:
    type: string
  review_due:
    type: string
  patterns:
    type: array
  pitfall_patterns:
    type: array
  principle:
    type: string
  diagnostic_rule:
    type: string
  anti_patterns:
    type: array
