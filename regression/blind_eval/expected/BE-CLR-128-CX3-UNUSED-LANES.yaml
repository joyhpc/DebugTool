    - "unused lanes"
    - "ground"
    - "floating"
    - "no frame"
    - "hardware requirement"
    - "error thread"
    - "lane"
  must_not_include:
    - "firmware workaround first"
    - "ignore unused lanes"
    - "software can compensate"
  near_hit_min_fraction: 0.70
review_notes:
  - "A hit treats unused-lane termination as a hardware branch, not a cosmetic board-detail."
