case_id: BE-CLR-113-FPGA-JTAG-ID
source_record: training/closed_loop/records/CLR-113-INTEL-FPGA-JTAG-ID-NOT-RECOGNIZED.yaml
actual_resolution_summary: "Intel/Altera configuration guidance prioritizes mode/status/JTAG pin setup, stable power, nCONFIG/nSTATUS release, and FPGA-end TDO/TDI/TCK evidence when the device ID is not recognized."
hit_criteria:
  must_include:
    - "VREF"
    - "TCK"
    - "TDI"
    - "TDO"
    - "nCONFIG"
    - "nSTATUS"
    - "CONF_DONE"
    - "FPGA end"
  must_not_include:
    - "bitstream first"
    - "programming file first"
    - "replace FPGA first"
  near_hit_min_fraction: 0.70
review_notes:
  - "A hit separates host/cable/port, board power/VREF, JTAG pins, and configuration status pins before file changes."
  - "Connector-only evidence is weaker than FPGA-end probing."
