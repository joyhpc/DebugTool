  must_not_include:
  - driver first
- id: REG-HOTSWAP-SAFETY
  input: High-side MOSFET hot-swap burns with large capacitor
  must_include:
  - current limit
  - SOA
  - VGS
  - VDS
  - ID
  must_not_include:
  - repeat full-power hot-plug
