counterexamples:
- description: Receiver CDR, comma, PCS, and video-valid are stable while no image appears.
  evidence_required: clean receiver status and frame counters; move to downstream framebuffer, scaler, timing, panel, or backlight path
- description: AUX or I2C control access fails before stream enable.
  evidence_required: bus NACKs, stuck line, missing device ID, or no register readback; use control-bus debug first
- description: Known-good decoder output is present at the FPGA pins but only one FPGA build fails.
  evidence_required: measured input activity and lane mapping are correct; compare FPGA refclk, SerDes config, constraints, reset, and PCS settings
