  type: decision
  check: "Verify num_lanes, tegra_sinterface, discontinuous_clk, mclk_multiplier, pix_clk_hz, and lane_polarity."
  why: "these mode-specific fields are common causes of sensor timeout."
  expected: "device-tree values match sensor wiring and clocking."
  p_hit: 0.65
  p_exclude: 0.55
  time_min: 25
  setup_min: 10
  risk_penalty: 0
  priority_score: 0.026
