blind_input:
  symptom: "Jetson CSI camera sensor times out or produces no frames during bring-up."
  background: "The driver has device-tree mode settings, sensor power_on sequencing, I2C access, and MIPI CSI configuration fields."
  observations:
  - "sensor timeout can occur even when the driver loads"
  - "I2C errors and wrong mode-specific settings have different first checks"
  constraints:
  - "do not rewrite image processing or userspace capture before kernel mode settings and I2C/power evidence are checked"
predicted_debug_tree:
- node: J1
  type: decision
  check: "Inspect dmesg for sensor I2C errors, chip ID read failure, and power_on sequence errors."
  why: "CSI packet debug is invalid if the sensor was never powered and configured."
  expected: "sensor register access succeeds after correct power, clock, GPIO, and timing order."
  p_hit: 0.55
  p_exclude: 0.60
  time_min: 15
  setup_min: 5
  risk_penalty: 0
  priority_score: 0.043
