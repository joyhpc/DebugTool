  p_hit: 0.50
  p_exclude: 0.60
  time_min: 25
  setup_min: 15
  risk_penalty: 0
  priority_score: 0.020
- node: J4
  type: terminal
  check: "If device-tree and I2C are clean but no frames arrive, branch to D-PHY lane/clock/settle timing and sensor stream-on table."
  why: "sensor stream state and D-PHY state are next after static host config."
  expected: "lane/clock/settle or stream-on register sequence explains the timeout."
  p_hit: 0.45
  p_exclude: 0.40
  time_min: 45
  setup_min: 15
  risk_penalty: 0
